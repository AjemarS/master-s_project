services:
  # Products Database
  products_db:
    image: postgres:15-alpine
    container_name: products_db
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_products_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices_network

  # Auth Database
  auth_db:
    image: postgres:15-alpine
    container_name: auth_db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices_network

  # Django Product Service
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product_service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@products_db:5432/products_db
      DJANGO_SETTINGS_MODULE: product_service.settings
      DJANGO_SECRET_KEY: your-secret-key-change-in-production
      ALLOWED_HOSTS: localhost, 127.0.0.1, product-service, gateway, frontend
      CORS_ALLOWED_ORIGINS: http://localhost, http://localhost:3000
    volumes:
      - ./product-service:/app
    ports:
      - "8000:8000"
    depends_on:
      products_db:
        condition: service_healthy
    networks:
      - microservices_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # Auth Service (Better Auth)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@auth_db:5432/auth_db
      BETTER_AUTH_SECRET: CRaoTYODSDKtVmxosfiHkjUjFbIlrVeY
      BETTER_AUTH_URL: http://localhost:3001/auth
      GOOGLE_CLIENT_ID: 354897909540-bv2ig1tu2p8eesihk3m7um7eqtfg82gl.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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
      GOOGLE_REDIRECT_URL: http://localhost:3001/auth/callback/google
      GITHUB_CLIENT_ID: Ov23liLjTfq6tsmIInNG
      GITHUB_CLIENT_SECRET: bf76bfcf8e2b08b7d19828a7b84f21ae92406787
      GITHUB_REDIRECT_URL: http://localhost:3001/auth/callback/github
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      auth_db:
        condition: service_healthy
    command: npm run dev
    networks:
      - microservices_network

  # API Gateway (FastAPI)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - FRONTEND_SERVICE_URL=http://frontend:3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CORS_ORIGINS=http://localhost,http://localhost:3000
    ports:
      - "80:8080"
    depends_on:
      - product-service
      - frontend
      - auth-service
    networks:
      - microservices_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_PUBLIC_AUTH_URL=http://localhost/auth
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - microservices_network
    command: npm run dev

volumes:
  postgres_products_data:
  postgres_auth_data:

networks:
  microservices_network:
    driver: bridge
