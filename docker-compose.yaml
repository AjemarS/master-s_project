services:
  # Products Database
  products_db:
    image: postgres:15-alpine
    container_name: products_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_products_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices_network

  # Inventory Database
  inventory_db:
    image: postgres:15-alpine
    container_name: inventory_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices_network

  # Orders Database
  orders_db:
    image: postgres:15-alpine
    container_name: orders_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ORDERS_DB_NAME}
      POSTGRES_USER: ${ORDERS_DB_USER}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD}
    volumes:
      - postgres_orders_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices_network

  # Auth Database
  auth_db:
    image: postgres:15-alpine
    container_name: auth_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices_network

  # Django Product Service
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@products_db:5432/${POSTGRES_DB}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DJANGO_SETTINGS_MODULE: product_service.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DEBUG: ${DEBUG}
      RABBITMQ_URL: ${RABBITMQ_URL}
    volumes:
      - ./product-service:/app
    ports:
      - "8000:8000"
    depends_on:
      products_db:
        condition: service_healthy
    networks:
      - microservices_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # Auth Service (Better Auth)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    restart: unless-stopped
    environment:
      PORT: ${AUTH_PORT}
      DATABASE_URL: postgresql://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@auth_db:5432/${AUTH_DB_NAME}
      FRONTEND_URL: ${FRONTEND_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      auth_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run dev"
    networks:
      - microservices_network

  # Django Inventory Service
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${INVENTORY_DB_USER}:${INVENTORY_DB_PASSWORD}@inventory_db:5432/${INVENTORY_DB_NAME}
      DB_NAME: ${INVENTORY_DB_NAME}
      DB_USER: ${INVENTORY_DB_USER}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      DB_HOST: inventory_db
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: inventory_service.settings
      DJANGO_SECRET_KEY: ${INVENTORY_DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DEBUG: ${DEBUG}
      RABBITMQ_URL: ${RABBITMQ_URL}
    volumes:
      - ./inventory-service:/app
    ports:
      - "8001:8001"
    depends_on:
      inventory_db:
        condition: service_healthy
    networks:
      - microservices_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8001"

  # Django Order Service
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${ORDERS_DB_USER}:${ORDERS_DB_PASSWORD}@orders_db:5432/${ORDERS_DB_NAME}
      DB_NAME: ${ORDERS_DB_NAME}
      DB_USER: ${ORDERS_DB_USER}
      DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      DB_HOST: orders_db
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: order_service.settings
      DJANGO_SECRET_KEY: ${ORDERS_DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DEBUG: ${DEBUG}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    volumes:
      - ./order-service:/app
    ports:
      - "8002:8002"
    depends_on:
      orders_db:
        condition: service_healthy
    networks:
      - microservices_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8002"

  # Product Event Consumer (RabbitMQ)
  product-consumer:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product_consumer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@products_db:5432/${POSTGRES_DB}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: products_db
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: product_service.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DEBUG: ${DEBUG}
      RABBITMQ_URL: ${RABBITMQ_URL}
    volumes:
      - ./product-service:/app
    depends_on:
      products_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices_network
    command: python manage.py consume_events

  # Inventory Event Consumer (RabbitMQ)
  inventory-consumer:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory_consumer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${INVENTORY_DB_USER}:${INVENTORY_DB_PASSWORD}@inventory_db:5432/${INVENTORY_DB_NAME}
      DB_NAME: ${INVENTORY_DB_NAME}
      DB_USER: ${INVENTORY_DB_USER}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      DB_HOST: inventory_db
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: inventory_service.settings
      DJANGO_SECRET_KEY: ${INVENTORY_DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DEBUG: ${DEBUG}
      RABBITMQ_URL: ${RABBITMQ_URL}
    volumes:
      - ./inventory-service:/app
    depends_on:
      inventory_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices_network
    command: python manage.py consume_events

  # API Gateway (FastAPI)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    restart: unless-stopped
    environment:
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL}
      - FRONTEND_SERVICE_URL=${FRONTEND_SERVICE_URL}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
    ports:
      - "80:8080"
    depends_on:
      - product-service
      - inventory-service
      - order-service
      - frontend
      - auth-service
    networks:
      - microservices_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_AUTH_URL=${NEXT_PUBLIC_AUTH_URL}
      - API_SERVICE_URL=${API_SERVICE_URL}
      - PROXY_AUTH_URL=${PROXY_AUTH_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - microservices_network
    command: npm run dev

  # RabbitMQ (event bus)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - microservices_network

  # Redis (for rate limiting)
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - microservices_network

volumes:
  postgres_products_data:
  postgres_inventory_data:
  postgres_orders_data:
  postgres_auth_data:
  redis_data:

networks:
  microservices_network:
    driver: bridge