[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["inventory", "inventory_service"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["inventory.models"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["inventory.*"]
disable_error_code = ["attr-defined", "arg-type"]

[[tool.mypy.overrides]]
module = [
    "rest_framework.*",
    "django_filters.*",
    "django.*",
    "drf_spectacular.*",
]
ignore_missing_imports = true
