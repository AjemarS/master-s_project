# Headers for public proxies (no auth)

proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;

proxy_set_header Host $proxy_host;

# Strip hop-by-hop and CORS headers from upstream responses
proxy_hide_header Content-Encoding;
proxy_hide_header Content-Length;
proxy_hide_header Transfer-Encoding;
proxy_hide_header Connection;
proxy_hide_header Keep-Alive;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Max-Age;
proxy_hide_header Access-Control-Expose-Headers;

# Redirect rewriting
proxy_redirect http://product-service:8000/ $scheme://$http_host/;
proxy_redirect http://order-service:8002/ $scheme://$http_host/;
proxy_redirect http://auth-service:3001/ $scheme://$http_host/;
