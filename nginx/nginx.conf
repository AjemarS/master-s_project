user nginx;
worker_processes auto;
pid /run/nginx.pid;

load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── njs import ──
    js_import auth from /etc/nginx/auth.js;
    js_import cors from /etc/nginx/cors.js;

    # ── Logging ──
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_status":$upstream_status,'
        '"bytes_sent":$bytes_sent'
    '}';

    access_log /dev/stdout json;
    error_log stderr info;

    # ── Rate limiting zones ──
    limit_req_zone $binary_remote_addr zone=orders_create:10m rate=10r/m;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    proxy_buffering on;
    proxy_http_version 1.1;

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    client_max_body_size 50M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;

    # ── HSTS map (enable only when proxied over HTTPS) ──
    map $http_x_forwarded_proto $hsts_header {
        default "";
        "https" "max-age=31536000; includeSubDomains";
    }

    # ── CORS (njs-driven, env-aware) ──
    js_set $cors_allow_origin cors.checkOrigin;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Main server ──
    server {
        listen 8080;
        server_name _;

        # Declare custom auth variables (set by njs at runtime, used in proxy_includes)
        set $gateway_user_id "";
        set $gateway_user_role "user";
        set $gateway_user_email "";
        set $gateway_user_name "";
        set $auth_user_id "";
        set $auth_user_role "user";
        set $auth_user_email "";
        set $auth_user_name "";

        # ── Internal auth check ──
        location = /auth-check {
            internal;
            set $auth_pass "http://auth-service:3001/auth/me";
            proxy_pass $auth_pass;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_intercept_errors on;
            error_page 400 401 403 404 500 503 504 =200;
            # 502 is NOT intercepted — auth-service failure propagates as 502
        }

        # ── Gateway health ──
        location = /gateway {
            default_type application/json;
            return 200 '{"message":"API Gateway is running."}';
        }

        location = /health {
            default_type application/json;
            return 200 '{"gateway":"healthy"}';
        }

        # ── Root → frontend ──
        location = / {
            proxy_pass http://frontend:3000;
            include /etc/nginx/proxy_frontend.conf;
        }

        # ── Stripe webhook (no auth, path rewrite) ──
        location /api/payments/webhook {
            proxy_pass http://order-service:8002/api/orders/stripe_webhook/;
            include /etc/nginx/proxy_public.conf;
        }

        # ── API routes (conditional auth) ──
        location /api/inventory/ {
            set $api_backend @api_inventory_backend;
            set $api_access inventory;
            rewrite ^/api/inventory/(.*) /api/$1 break;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/orders/ {
            set $api_backend @api_orders_backend;
            set $api_access orders;
            limit_req zone=orders_create burst=5 nodelay;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/reports/ {
            set $api_backend @api_reports_backend;
            set $api_access reports;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/notifications/stream {
            set $api_backend @api_notifications_stream;
            set $api_access notifications;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location @api_notifications_stream {
            proxy_pass http://notification-service:8003;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;
            include /etc/nginx/proxy_api.conf;
        }

        location /api/notifications {
            set $api_backend @api_notifications_backend;
            set $api_access notifications;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/cart/ {
            set $api_backend @api_cart_backend;
            set $api_access cart;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/ {
            set $api_backend @api_product_backend;
            set $api_access product;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        # ── Audit logs (no nginx auth — checked by audit-service) ──
        location /api/audit/ {
            proxy_pass http://audit-service:8005;
            include /etc/nginx/proxy_public.conf;
        }

        # ── Media (no auth) ──
        location /media/ {
            proxy_pass http://product-service:8000;
            proxy_buffering off;
            proxy_request_buffering off;
            include /etc/nginx/proxy_media.conf;
        }

        # ── Auth passthrough (no auth) ──
        location /auth/ {
            proxy_pass http://auth-service:3001;
            include /etc/nginx/proxy_public.conf;
        }

        # ── Admin page auth backstop (frontend proxy.ts handles role checks) ──
        location ~ ^/(ua|en)/admin {
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;

            if ($auth_user_id = "") {
                return 401;
            }

            proxy_pass http://frontend:3000;
            include /etc/nginx/proxy_frontend.conf;
        }

        # ── Frontend catch-all ──
        location / {
            proxy_pass http://frontend:3000;
            include /etc/nginx/proxy_frontend.conf;
        }

        # ── Named proxy backends (used by njs after auth) ──
        location @api_inventory_backend {
            proxy_pass http://inventory-service:8001;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_orders_backend {
            proxy_pass http://order-service:8002;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_reports_backend {
            proxy_pass http://order-service:8002;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_notifications_backend {
            proxy_pass http://notification-service:8003;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_cart_backend {
            proxy_pass http://product-service:8000;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_product_backend {
            proxy_pass http://product-service:8000;
            include /etc/nginx/proxy_api.conf;
        }

        # ── Security headers on all responses ──
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com; style-src 'self' 'unsafe-inline'; frame-src https://js.stripe.com; img-src 'self' data:; connect-src 'self' https://api.stripe.com" always;

        # ── CORS headers on all responses ──
        # Applied at server level so all locations inherit
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-Gateway-User-Id, X-Gateway-User-Role, X-Session-Id" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary Origin always;

        # Handle CORS preflight
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
