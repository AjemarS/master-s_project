user nginx;
worker_processes auto;
pid /run/nginx.pid;

load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── njs import ──
    js_import auth from /etc/nginx/auth.js;

    # ── Logging ──
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_status":$upstream_status,'
        '"bytes_sent":$bytes_sent'
    '}';

    access_log /dev/stdout json;
    error_log stderr info;

    # ── Proxy settings ──
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    proxy_buffering on;
    proxy_http_version 1.1;

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    client_max_body_size 50M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── CORS map ──
    map $http_origin $cors_allow_origin {
        default '';
        "~^http://localhost(:\d+)?$"        "$http_origin";
        "~^http://127\.0\.0\.1(:\d+)?$"    "$http_origin";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Main server ──
    server {
        listen 8080;
        server_name _;

        # Declare custom auth variables (set by njs at runtime, used in proxy_includes)
        set $gateway_user_id "";
        set $gateway_user_role "user";
        set $gateway_user_email "";
        set $gateway_user_name "";
        set $auth_user_id "";
        set $auth_user_role "user";
        set $auth_user_email "";
        set $auth_user_name "";

        # ── Internal auth check ──
        location = /auth-check {
            internal;
            set $auth_pass "http://auth-service:3001/auth/me";
            proxy_pass $auth_pass;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_intercept_errors on;
            error_page 400 401 403 404 500 502 503 504 =200;
        }

        # ── Gateway health ──
        location = /gateway {
            default_type application/json;
            return 200 '{"message":"API Gateway is running."}';
        }

        location = /health {
            default_type application/json;
            return 200 '{"gateway":"healthy"}';
        }

        # ── Root → frontend ──
        location = / {
            proxy_pass http://frontend:3000;
            include /etc/nginx/proxy_frontend.conf;
        }

        # ── Stripe webhook (no auth, path rewrite) ──
        location /api/payments/webhook {
            proxy_pass http://order-service:8002/api/orders/stripe_webhook/;
            include /etc/nginx/proxy_public.conf;
        }

        # ── API routes (conditional auth) ──
        location /api/inventory/ {
            set $api_backend @api_inventory_backend;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/orders/ {
            set $api_backend @api_orders_backend;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/reports/ {
            set $api_backend @api_reports_backend;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/notifications/ {
            set $api_backend @api_notifications_backend;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/cart/ {
            set $api_backend @api_cart_backend;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/ {
            set $api_backend @api_product_backend;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        # ── Media (no auth) ──
        location /media/ {
            proxy_pass http://product-service:8000;
            proxy_buffering off;
            proxy_request_buffering off;
            include /etc/nginx/proxy_public.conf;
        }

        # ── Auth passthrough (no auth) ──
        location /auth/ {
            proxy_pass http://auth-service:3001;
            include /etc/nginx/proxy_public.conf;
        }

        # ── Frontend catch-all ──
        location / {
            proxy_pass http://frontend:3000;
            include /etc/nginx/proxy_frontend.conf;
        }

        # ── Named proxy backends (used by njs after auth) ──
        location @api_inventory_backend {
            proxy_pass http://inventory-service:8001;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_orders_backend {
            proxy_pass http://order-service:8002;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_reports_backend {
            proxy_pass http://order-service:8002;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_notifications_backend {
            proxy_pass http://notification-service:8003;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_cart_backend {
            proxy_pass http://product-service:8000;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_product_backend {
            proxy_pass http://product-service:8000;
            include /etc/nginx/proxy_api.conf;
        }

        # ── CORS headers on all responses ──
        # Applied at server level so all locations inherit
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-Gateway-User-Id, X-Gateway-User-Role" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary Origin always;

        # Handle CORS preflight
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
