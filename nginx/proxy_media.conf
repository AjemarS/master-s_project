# Headers for media proxy (no auth, preserves Content-Length/Content-Encoding)

proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;

proxy_set_header Host $proxy_host;

# Strip hop-by-hop headers only — keep Content-Length and Content-Encoding
# so clients get file-size info (progress bars) and correct encoding.
proxy_hide_header Transfer-Encoding;
proxy_hide_header Connection;
proxy_hide_header Keep-Alive;

# Strip CORS headers from upstream (gateway adds its own)
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Max-Age;
proxy_hide_header Access-Control-Expose-Headers;

# Redirect rewriting
proxy_redirect http://product-service:8000/ $scheme://$http_host/;
