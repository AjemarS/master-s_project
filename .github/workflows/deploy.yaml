name: Deploy

# Called by CI after publish-images. Each GitHub Environment (staging, prod) holds:
#   vars:    PUBLIC_URL (e.g. https://staging.example.com)
#   secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
# prod should require a reviewer (Settings → Environments → prod). Host setup: deploy/README.md.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    concurrency: deploy-${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      TAG: ${{ github.sha }}
      DEPLOY_ENV: ${{ inputs.environment }}
      NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_URL }}/api
      NEXT_PUBLIC_AUTH_URL: ${{ vars.PUBLIC_URL }}/auth
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* are inlined at build time, so the frontend is built per environment
      - name: Build frontend
        run: |
          export REGISTRY=${REGISTRY,,}
          docker compose -f docker-compose.yaml -f docker-compose.prod.yaml build frontend
          docker compose -f docker-compose.yaml -f docker-compose.prod.yaml push frontend

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # check out first, then run: a script must not be rewritten while it runs
          ssh -i ~/.ssh/id_deploy "$TARGET" \
            "cd /opt/techhub-$DEPLOY_ENV && git fetch -q origin $TAG && git checkout -q --detach FETCH_HEAD && sh deploy/deploy.sh $DEPLOY_ENV $TAG"

      - name: Check health
        run: curl -fsS --retry 20 --retry-delay 6 --retry-all-errors "${{ vars.PUBLIC_URL }}/health"
