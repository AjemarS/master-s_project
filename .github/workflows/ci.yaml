name: CI

on:
  push:
    branches: [main]

jobs:
  lint-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gateway/requirements.txt
      - run: pip install ruff mypy -r gateway/requirements.txt
      - run: ruff check gateway/
      - run: mypy gateway/

  lint-product-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: product-service/requirements.txt
      - run: pip install ruff mypy django-stubs djangorestframework-stubs types-django-filter -r product-service/requirements.txt
      - run: ruff check product-service/
      - run: mypy .
        working-directory: product-service

  lint-auth-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: auth-service/package-lock.json
      - run: npm ci
        working-directory: auth-service
      - run: npm run lint
        working-directory: auth-service
      - run: npm run typecheck
        working-directory: auth-service

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  test-product-service:
    runs-on: ubuntu-latest
    needs: [lint-product-service]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-key
      DEBUG: "True"
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_pass
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: product-service/requirements.txt
      - run: pip install -r product-service/requirements.txt
      - run: python manage.py migrate
        working-directory: product-service
      - run: python manage.py test
        working-directory: product-service

  test-auth-service:
    runs-on: ubuntu-latest
    needs: [lint-auth-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: auth-service/package-lock.json
      - run: npm ci
        working-directory: auth-service
      - run: npm run test
        working-directory: auth-service

  test-frontend:
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

  test-frontend-e2e:
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-product-service, test-auth-service]
    env:
      TEST_ADMIN_EMAIL: admin@ci-test.local
      TEST_ADMIN_PASSWORD: ci-e2e-admin-password
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cat > .env.ci << 'ENVEOF'
          POSTGRES_DB=products_db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          DB_HOST=products_db
          DB_PORT=5432
          AUTH_DB_NAME=auth_db
          AUTH_DB_USER=postgres
          AUTH_DB_PASSWORD=postgres
          AUTH_PORT=3001
          BETTER_AUTH_SECRET=ci-e2e-better-auth-secret-not-for-production
          BETTER_AUTH_URL=http://auth-service:3001/auth
          DJANGO_SECRET_KEY=ci-e2e-django-secret-key
          DEBUG=True
          ALLOWED_HOSTS=*
          CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost
          PRODUCT_SERVICE_URL=http://product-service:8000
          FRONTEND_SERVICE_URL=http://frontend:3000
          AUTH_SERVICE_URL=http://auth-service:3001
          API_SERVICE_URL=http://gateway:8080/api
          CORS_ORIGINS=http://localhost:3000,http://localhost
          NEXT_PUBLIC_API_URL=http://localhost:3000/api
          NEXT_PUBLIC_AUTH_URL=http://localhost:3000/auth
          PROXY_AUTH_URL=http://gateway:8080/auth
          NODE_ENV=development
          FRONTEND_URL=http://localhost:3000
          REDIS_URL=redis://redis:6379
          ADMIN_EMAIL=admin@ci-test.local
          ADMIN_PASSWORD=ci-e2e-admin-password
          ADMIN_NAME=CI Admin
          LOG_LEVEL=info
          ENVEOF

      - name: Build and start backend services
        run: |
          docker compose --env-file .env.ci up -d --build
          docker compose stop frontend

      - name: Wait for gateway
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:80/health > /dev/null 2>&1; then
              echo "Gateway healthy"
              break
            fi
            echo "Waiting for gateway... ($i/30)"
            sleep 2
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.ci down -v

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint-gateway, lint-product-service, lint-auth-service, lint-frontend, test-product-service, test-auth-service, test-frontend, test-frontend-e2e]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r gateway/requirements.txt
      - run: pip-audit -r product-service/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: auth-service/package-lock.json
      - run: npm ci
        working-directory: auth-service
      - run: npm audit --production --audit-level=high
        working-directory: auth-service
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --production --audit-level=high
        working-directory: frontend
